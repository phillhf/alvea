services:
  betten:
    build: .
    image: betten-entlassreinigung:latest
    container_name: betten-entlassreinigung
    restart: unless-stopped
    ports:
      - "37843:37843"
    environment:
      - NODE_ENV=production
      - PORT=37843
      - HOST=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:?Bitte JWT_SECRET in .env setzen – siehe .env.example}
      - JWT_EXPIRES_IN=12h
      - RETENTION_DAYS=90
      - LOG_LEVEL=info
      - DB_FILE=/app/betten/backend/data/bettenaufbereitung.sqlite
      - UPLOAD_DIR=/app/betten/backend/uploads
      - LOG_DIR=/app/betten/backend/logs
      # Optional: für Hosting hinter eigener Domain / Reverse Proxy
      - CORS_ORIGIN=${CORS_ORIGIN:-}
    volumes:
      - betten-data:/app/betten/backend/data
      - betten-uploads:/app/betten/backend/uploads
      - betten-logs:/app/betten/backend/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:37843/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  betten-data:
  betten-uploads:
  betten-logs:
