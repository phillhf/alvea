name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Backend bauen
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Frontend bauen
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
